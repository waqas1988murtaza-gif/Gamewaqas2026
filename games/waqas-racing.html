<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏎️ Waqas Racing — by Waqas Game Hub</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background: radial-gradient(1000px 500px at 50% -10%, #1e2a5a 0%, #0a0e1f 60%, #05070f 100%);
    font-family:'Segoe UI', system-ui, sans-serif; color:#fff;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow:hidden; user-select:none; touch-action:none;
  }
  #wrap { position:relative; width:min(420px, 96vw); }
  canvas {
    width:100%; border-radius:18px; display:block;
    box-shadow:0 20px 60px rgba(0,0,0,.6), 0 0 40px rgba(34,211,238,.15);
    border:2px solid rgba(255,255,255,.12);
    background:#111;
  }
  #hud {
    position:absolute; top:10px; left:12px; right:12px;
    display:flex; justify-content:space-between; pointer-events:none;
    font-weight:800; font-size:15px; text-shadow:0 2px 6px #000;
  }
  #hud .pill { background:rgba(0,0,0,.55); padding:6px 14px; border-radius:999px; border:1px solid rgba(255,255,255,.2); }
  .overlay {
    position:absolute; inset:0; border-radius:18px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:rgba(5,8,18,.82); backdrop-filter:blur(6px); text-align:center; padding:20px;
  }
  .overlay h1 { font-size:30px; background:linear-gradient(90deg,#22d3ee,#a78bfa,#f472b6);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .overlay p { color:#aeb8d4; font-size:14px; line-height:1.6; }
  .overlay .big { font-size:52px; }
  .btn {
    background:linear-gradient(90deg,#22d3ee,#a78bfa); border:none; color:#0a0e1f;
    font-weight:900; font-size:17px; padding:13px 38px; border-radius:999px; cursor:pointer;
    box-shadow:0 8px 24px rgba(34,211,238,.4); transition:transform .15s;
  }
  .btn:active { transform:scale(.95); }
  #touch { display:none; justify-content:space-between; margin-top:12px; width:min(420px,96vw); }
  #touch button {
    flex:1; margin:0 8px; padding:16px 0; font-size:26px; border-radius:16px; border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.08); color:#fff; cursor:pointer;
  }
  #touch button:active { background:rgba(34,211,238,.35); }
  @media (pointer:coarse) { #touch { display:flex; } #hint{display:none;} }
  #hint { color:#5b6b8c; font-size:12px; margin-top:10px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="420" height="640"></canvas>
  <div id="hud">
    <span class="pill">🏁 <span id="score">0</span></span>
    <span class="pill">⚡ <span id="speed">0</span> km/h</span>
    <span class="pill">🏆 <span id="best">0</span></span>
  </div>
  <div class="overlay" id="startScreen">
    <div class="big">🏎️</div>
    <h1>WAQAS RACING</h1>
    <p>Dodge the traffic, survive as long as you can!<br>⬅️ ➡️ arrow keys or A/D to steer.<br>Near misses = bonus points 🔥</p>
    <button class="btn" id="startBtn">START RACE</button>
  </div>
  <div class="overlay hidden" id="overScreen">
    <div class="big">💥</div>
    <h1>CRASH!</h1>
    <p>Score: <b id="finalScore" style="color:#22d3ee">0</b> · Best: <b id="finalBest" style="color:#f472b6">0</b></p>
    <p id="newBest" class="hidden" style="color:#fbbf24;font-weight:800">🎉 NEW BEST! 🎉</p>
    <button class="btn" id="retryBtn">RACE AGAIN</button>
  </div>
</div>
<div id="touch">
  <button id="tLeft">⬅️</button>
  <button id="tRight">➡️</button>
</div>
<div id="hint">Use ⬅️ ➡️ arrow keys (or A / D) to steer</div>

<script>
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const W = 420, H = 640;
const ROAD_X = 60, ROAD_W = 300, LANES = 4;
const laneX = i => ROAD_X + (i + 0.5) * (ROAD_W / LANES);

let running = false, score = 0, speed = 0, dist = 0, best = +(localStorage.getItem('waqasRacingBest') || 0);
let player, enemies, stripes, particles, keys = {}, lastTime = 0, spawnT = 0, shake = 0;
document.getElementById('best').textContent = best;

function reset() {
  player = { lane: 1, x: laneX(1), y: H - 130, w: 46, h: 78, tilt: 0 };
  enemies = []; particles = [];
  stripes = Array.from({length: 12}, (_, i) => i * 60);
  score = 0; speed = 140; dist = 0; spawnT = 0; shake = 0;
  updateHUD();
}
function updateHUD() {
  document.getElementById('score').textContent = Math.floor(score);
  document.getElementById('speed').textContent = Math.floor(speed / 2.2);
  document.getElementById('best').textContent = best;
}

// --- input ---
addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
  if ((e.key === 'Enter' || e.key === ' ') && !running) start();
});
addEventListener('keyup', e => keys[e.key] = false);
const hold = (id, key) => {
  const b = document.getElementById(id);
  const on = e => { e.preventDefault(); keys[key] = true; };
  const off = e => { e.preventDefault(); keys[key] = false; };
  b.addEventListener('touchstart', on, {passive:false});
  b.addEventListener('touchend', off, {passive:false});
  b.addEventListener('mousedown', on); b.addEventListener('mouseup', off); b.addEventListener('mouseleave', off);
};
hold('tLeft', 'ArrowLeft'); hold('tRight', 'ArrowRight');

function drawCar(x, y, w, h, color, dark, tilt) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt || 0);
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(4, 6, w/2, h/2, 0, 0, 7); ctx.fill();
  // body
  const g = ctx.createLinearGradient(-w/2, 0, w/2, 0);
  g.addColorStop(0, dark); g.addColorStop(.5, color); g.addColorStop(1, dark);
  ctx.fillStyle = g;
  roundRect(-w/2, -h/2, w, h, 10); ctx.fill();
  // cabin
  ctx.fillStyle = 'rgba(10,15,30,.85)';
  roundRect(-w/2+8, -h/2+14, w-16, h*0.34, 7); ctx.fill();
  // windshield shine
  ctx.fillStyle = 'rgba(140,220,255,.5)';
  roundRect(-w/2+11, -h/2+17, w-22, 8, 4); ctx.fill();
  // headlights
  ctx.fillStyle = '#fef9c3';
  ctx.fillRect(-w/2+5, h/2-9, 9, 5); ctx.fillRect(w/2-14, h/2-9, 9, 5);
  // wheels
  ctx.fillStyle = '#0a0a0a';
  [[-w/2-4,-h/2+10],[w/2-4,-h/2+10],[-w/2-4,h/2-24],[w/2-4,h/2-24]].forEach(([wx,wy]) => {
    roundRect(wx, wy, 8, 16, 3); ctx.fill();
  });
  ctx.restore();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}

const ENEMY_COLORS = [['#ef4444','#991b1b'],['#f59e0b','#92400e'],['#8b5cf6','#4c1d95'],['#22d3ee','#0e7490'],['#a3a3a3','#404040']];

function spawnEnemy() {
  const lane = Math.floor(Math.random() * LANES);
  // avoid impossible walls: don't fill all lanes at similar y
  const near = enemies.filter(e => e.y < 120);
  if (near.length >= LANES - 1 && near.some(e => e.lane === lane)) return;
  const c = ENEMY_COLORS[Math.floor(Math.random() * ENEMY_COLORS.length)];
  enemies.push({ lane, x: laneX(lane), y: -90, w: 46, h: 78, color: c[0], dark: c[1], speed: speed * (0.35 + Math.random() * 0.2), passed: false });
}

function explode(x, y) {
  for (let i = 0; i < 26; i++) {
    particles.push({ x, y, vx: (Math.random()-0.5)*380, vy: (Math.random()-0.5)*380 - 60,
      life: 0.7 + Math.random()*0.5, t: 0, c: ['#fbbf24','#f97316','#ef4444','#fff'][i%4], s: 3+Math.random()*5 });
  }
  shake = 14;
}

function start() {
  reset();
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('overScreen').classList.add('hidden');
  running = true; lastTime = performance.now();
  requestAnimationFrame(loop);
}
function gameOver() {
  running = false;
  explode(player.x, player.y);
  const s = Math.floor(score);
  const isBest = s > best;
  if (isBest) { best = s; localStorage.setItem('waqasRacingBest', best); }
  document.getElementById('finalScore').textContent = s;
  document.getElementById('finalBest').textContent = best;
  document.getElementById('newBest').classList.toggle('hidden', !isBest);
  setTimeout(() => document.getElementById('overScreen').classList.remove('hidden'), 650);
}
document.getElementById('startBtn').onclick = start;
document.getElementById('retryBtn').onclick = start;

function loop(t) {
  if (!running) return;
  const dt = Math.min((t - lastTime) / 1000, 0.05); lastTime = t;

  // steering
  const steerSpeed = 340;
  let targetLane = player.lane;
  if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && player.lane > 0) { targetLane = player.lane - 1; keys['ArrowLeft']=keys['a']=keys['A']=false; }
  if ((keys['ArrowRight'] || keys['d'] || keys['D']) && player.lane < LANES - 1) { targetLane = player.lane + 1; keys['ArrowRight']=keys['d']=keys['D']=false; }
  player.lane = targetLane;
  const tx = laneX(player.lane);
  player.tilt = (tx - player.x) * 0.0022;
  player.x += (tx - player.x) * Math.min(1, dt * 10);

  // speed & score
  speed = Math.min(420, speed + dt * 9);
  dist += speed * dt;
  score += dt * (speed / 38);

  // spawn
  spawnT -= dt;
  if (spawnT <= 0) { spawnEnemy(); spawnT = Math.max(0.42, 1.25 - speed / 480); }

  // stripes
  stripes.forEach((s, i) => { stripes[i] = (s + speed * dt) % (H + 60); });

  // enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.y += (speed - e.speed) * dt;
    if (!e.passed && e.y > player.y + 60) { e.passed = true; score += 12; }
    // near-miss bonus
    if (!e.counted && Math.abs(e.y - player.y) < 70 && Math.abs(e.x - player.x) > 44 && Math.abs(e.x - player.x) < 80) {
      e.counted = true; score += 25;
      particles.push({x: player.x, y: player.y - 50, vx: 0, vy: -120, life: 0.8, t: 0, c: '#22d3ee', s: 4, text: '+25'});
    }
    if (e.y > H + 100) { enemies.splice(i, 1); continue; }
    // collision
    if (Math.abs(e.x - player.x) < (e.w + player.w) / 2 - 8 &&
        Math.abs(e.y - player.y) < (e.h + player.h) / 2 - 8) {
      gameOver();
    }
  }

  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.t += dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt;
    if (p.t > p.life) particles.splice(i, 1);
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 40);

  draw();
  updateHUD();
  requestAnimationFrame(loop);
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

  // grass
  const gg = ctx.createLinearGradient(0, 0, 0, H);
  gg.addColorStop(0, '#14532d'); gg.addColorStop(1, '#052e16');
  ctx.fillStyle = gg; ctx.fillRect(-20, -20, W + 40, H + 40);

  // road
  ctx.fillStyle = '#1f2430'; ctx.fillRect(ROAD_X, 0, ROAD_W, H);
  ctx.fillStyle = '#2b3242'; ctx.fillRect(ROAD_X, 0, 8, H); ctx.fillRect(ROAD_X + ROAD_W - 8, 0, 8, H);
  // edge lines
  ctx.fillStyle = '#fbbf24';
  ctx.fillRect(ROAD_X + 12, 0, 4, H); ctx.fillRect(ROAD_X + ROAD_W - 16, 0, 4, H);
  // lane dashes
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  for (let l = 1; l < LANES; l++) {
    const x = ROAD_X + l * (ROAD_W / LANES);
    stripes.forEach(s => ctx.fillRect(x - 3, s - 60, 6, 34));
  }

  // enemies
  enemies.forEach(e => drawCar(e.x, e.y, e.w, e.h, e.color, e.dark, 0));
  // player
  if (running || document.getElementById('overScreen').classList.contains('hidden'))
    drawCar(player.x, player.y, player.w, player.h, '#22d3ee', '#0e7490', player.tilt);

  // particles
  particles.forEach(p => {
    ctx.globalAlpha = 1 - p.t / p.life;
    if (p.text) {
      ctx.fillStyle = p.c; ctx.font = '900 20px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(p.text, p.x, p.y);
    } else {
      ctx.fillStyle = p.c; ctx.fillRect(p.x - p.s/2, p.y - p.s/2, p.s, p.s);
    }
  });
  ctx.globalAlpha = 1;
  ctx.restore();

  // vignette
  const v = ctx.createRadialGradient(W/2, H/2, H/3, W/2, H/2, H/1.1);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.45)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

// idle background animation behind start screen
reset();
(function idle() {
  if (running) return;
  stripes.forEach((s, i) => { stripes[i] = (s + 3) % (H + 60); });
  draw();
  requestAnimationFrame(idle);
})();
</script>
</body>
</html>
